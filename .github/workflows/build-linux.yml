name: Build TinyStudio for Linux

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Build/verify logic lives in scripts/build.sh. See that script for the
    # AOT/RID/XAML-weaving rationale and the "no dotnet clean" constraint.
    # The build env vars are set by the script itself so CI and local builds
    # behave identically.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup .NET 11.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore + 2 publishes + AOT verification all happen inside the script.
      - name: Build, publish and verify (all variants)
        shell: bash
        run: bash scripts/build.sh --verify

      - name: Upload .NET 11 linux-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-linux-x64
          path: ./publish-net11

      - name: Upload .NET 11 linux-x64 Artifact(AOT)
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-AOT-linux-x64
          path: ./publish-net11-aot
