name: Build TinyStudio for Linux

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      satori:
        description: 'Also build the Satori GC variants (self-contained)'
        type: boolean
        default: false
      nodedata:
        description: 'Also build the JIT variants that parse through the NodeData backend'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Build/verify logic lives in scripts/build.sh. See that script for the
    # AOT/RID/XAML-weaving rationale and the "no dotnet clean" constraint.
    # The build env vars are set by the script itself so CI and local builds
    # behave identically.
    #
    # Default (push/PR) behavior is unchanged: net11 + net11-aot on server GC.
    # The Satori GC and NodeData-backend variants are opt-in through the
    # workflow_dispatch inputs above.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup .NET 11.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore + publishes + AOT verification all happen inside the script.
      - name: Build, publish and verify (all variants)
        shell: bash
        run: |
          extra=()
          if [[ '${{ inputs.satori }}' == 'true' ]]; then extra+=(--satori); fi
          if [[ '${{ inputs.nodedata }}' == 'true' ]]; then extra+=(--nodedata); fi
          bash scripts/build.sh --verify "${extra[@]}"

      - name: Upload .NET 11 linux-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-linux-x64
          path: ./publish-net11

      - name: Upload .NET 11 linux-x64 Artifact(AOT)
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-AOT-linux-x64
          path: ./publish-net11-aot

      - name: Upload .NET 11 linux-x64 Artifact(Satori GC)
        if: ${{ inputs.satori }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-satori-linux-x64
          path: ./publish-net11-satori

      - name: Upload .NET 11 linux-x64 Artifact(AOT, Satori GC)
        if: ${{ inputs.satori }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-AOT-satori-linux-x64
          path: ./publish-net11-aot-satori

      - name: Upload .NET 11 linux-x64 Artifact(NodeData backend)
        if: ${{ inputs.nodedata }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-nodedata-linux-x64
          path: ./publish-net11-nodedata

      - name: Upload .NET 11 linux-x64 Artifact(Satori GC, NodeData backend)
        if: ${{ inputs.satori && inputs.nodedata }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-satori-nodedata-linux-x64
          path: ./publish-net11-satori-nodedata
