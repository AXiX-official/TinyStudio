name: Build TinyStudio for Windows

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Build/verify logic lives in scripts/build.ps1 (scripts/build.bat for
    # local use). See that script for the AOT/RID/XAML-weaving rationale and
    # the "no dotnet clean" constraint. The build env vars are set by the
    # script itself so CI and local builds behave identically.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup .NET 11.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore + 4 publishes + AOT verification all happen inside the script.
      - name: Build, publish and verify (all variants)
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload .NET 10 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net10-windows-x64
          path: ./publish-net10

      - name: Upload .NET 10 Artifact(AOT)
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net10-AOT-windows-x64
          path: ./publish-net10-aot

      - name: Upload .NET 11 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-windows-x64
          path: ./publish-net11

      - name: Upload .NET 11 Artifact(AOT)
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-AOT-windows-x64
          path: ./publish-net11-aot
