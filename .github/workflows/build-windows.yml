name: Build TinyStudio for Windows

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      satori:
        description: 'Also build the Satori GC variants (self-contained)'
        type: boolean
        default: false
      nodedata:
        description: 'Also build the JIT variants that parse through the NodeData backend'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest

    # Build/verify logic lives in scripts/build.ps1 (scripts/build.bat for
    # local use). See that script for the AOT/RID/XAML-weaving rationale and
    # the "no dotnet clean" constraint. The build env vars are set by the
    # script itself so CI and local builds behave identically.
    #
    # Default (push/PR) behavior is unchanged: the four server-GC variants.
    # The Satori GC and NodeData-backend variants are opt-in through the
    # workflow_dispatch inputs above; their publish folders carry a suffix
    # (publish-net10-satori, publish-net11-nodedata, ...) while the default
    # ones keep their existing names.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup .NET 11.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore + publishes + AOT verification all happen inside the script.
      - name: Build, publish and verify (all variants)
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ inputs.satori }}' -eq 'true') { $extra += '-Satori' }
          if ('${{ inputs.nodedata }}' -eq 'true') { $extra += '-NodeData' }
          ./scripts/build.ps1 -Verify @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload .NET 10 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net10-windows-x64
          path: ./publish-net10

      - name: Upload .NET 10 Artifact(AOT)
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net10-AOT-windows-x64
          path: ./publish-net10-aot

      - name: Upload .NET 11 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-windows-x64
          path: ./publish-net11

      - name: Upload .NET 11 Artifact(AOT)
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-AOT-windows-x64
          path: ./publish-net11-aot

      - name: Upload .NET 10 Artifact(Satori GC)
        if: ${{ inputs.satori }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net10-satori-windows-x64
          path: ./publish-net10-satori

      - name: Upload .NET 10 Artifact(AOT, Satori GC)
        if: ${{ inputs.satori }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net10-AOT-satori-windows-x64
          path: ./publish-net10-aot-satori

      - name: Upload .NET 11 Artifact(Satori GC)
        if: ${{ inputs.satori }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-satori-windows-x64
          path: ./publish-net11-satori

      - name: Upload .NET 11 Artifact(AOT, Satori GC)
        if: ${{ inputs.satori }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-AOT-satori-windows-x64
          path: ./publish-net11-aot-satori

      - name: Upload .NET 10 Artifact(NodeData backend)
        if: ${{ inputs.nodedata }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net10-nodedata-windows-x64
          path: ./publish-net10-nodedata

      - name: Upload .NET 11 Artifact(NodeData backend)
        if: ${{ inputs.nodedata }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-nodedata-windows-x64
          path: ./publish-net11-nodedata

      - name: Upload .NET 10 Artifact(Satori GC, NodeData backend)
        if: ${{ inputs.satori && inputs.nodedata }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net10-satori-nodedata-windows-x64
          path: ./publish-net10-satori-nodedata

      - name: Upload .NET 11 Artifact(Satori GC, NodeData backend)
        if: ${{ inputs.satori && inputs.nodedata }}
        uses: actions/upload-artifact@v4
        with:
          name: TinyStudio-net11-satori-nodedata-windows-x64
          path: ./publish-net11-satori-nodedata
